    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap">
    <script>
        (function () {
            'use strict';
            var THEME_COOKIE = 'theme';
            var DARK = 'dark';
            var LIGHT = 'light';
            var html = document.documentElement;

            function readCookie(name) {
                var match = document.cookie.match(new RegExp('(^|;\\s*)' + name + '=([^;]+)'));
                return match ? decodeURIComponent(match[2]) : null;
            }

            function writeCookie(name, value, days) {
                var expires = '';
                if (days) {
                    var date = new Date();
                    date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
                    expires = '; expires=' + date.toUTCString();
                }
                document.cookie = name + '=' + encodeURIComponent(value) + expires + '; path=/; SameSite=Lax';
            }

            function getInitialTheme() {
                var cookieTheme = readCookie(THEME_COOKIE);
                if (cookieTheme === DARK || cookieTheme === LIGHT) {
                    return cookieTheme;
                }
                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    return DARK;
                }
                return LIGHT;
            }

            function applyTheme(theme) {
                html.setAttribute('data-theme', theme);
                writeCookie(THEME_COOKIE, theme, 365);
                updateToggleButton(theme);
            }

            function updateToggleButton(theme) {
                var btn = document.getElementById('theme-toggle');
                if (!btn) return;
                // Support both old structure (icon/label spans) and new structure (direct emoji)
                var icon = btn.querySelector('.theme-toggle__icon');
                var label = btn.querySelector('.theme-toggle__label');
                if (theme === DARK) {
                    btn.setAttribute('aria-label', 'Switch to light mode');
                    btn.title = 'Switch to light mode';
                    if (icon) icon.textContent = '☀️';
                    if (label) label.textContent = 'Light';
                    if (!icon && !label) btn.textContent = '☀️';
                } else {
                    btn.setAttribute('aria-label', 'Switch to dark mode');
                    btn.title = 'Switch to dark mode';
                    if (icon) icon.textContent = '🌙';
                    if (label) label.textContent = 'Dark';
                    if (!icon && !label) btn.textContent = '🌙';
                }
            }

            function toggleTheme() {
                var current = html.getAttribute('data-theme') || LIGHT;
                var next = current === DARK ? LIGHT : DARK;
                applyTheme(next);
            }

            // Create theme toggle button early and inject into page
            function createThemeToggleButton() {
                var btn = document.createElement('button');
                btn.id = 'theme-toggle';
                btn.type = 'button';
                btn.className = 'mu-fab__theme'; // reuse existing dark-mode styles from music.css
                btn.setAttribute('aria-label', 'Switch to dark mode');
                btn.title = 'Toggle theme';
                btn.textContent = '🌙'; // default to light mode icon (moon = switch to dark)
                return btn;
            }

            // Set initial theme immediately (before paint)
            var theme = getInitialTheme();
            html.setAttribute('data-theme', theme);

            // Insert theme toggle button into the page as soon as possible
            function insertThemeToggle() {
                var fabWrap = document.querySelector('.mu-fab-wrap');
                if (fabWrap) {
                    // If music.js already created the wrapper, insert our button there
                    var existing = fabWrap.querySelector('#theme-toggle');
                    if (!existing) {
                        var btn = createThemeToggleButton();
                        fabWrap.appendChild(btn);
                        btn.addEventListener('click', toggleTheme);
                        updateToggleButton(theme);
                    }
                } else {
                    // Create our own wrapper (fixed bottom-right, above mobile nav)
                    fabWrap = document.createElement('div');
                    fabWrap.className = 'mu-fab-wrap';
                    var btn = createThemeToggleButton();
                    fabWrap.appendChild(btn);
                    (document.getElementById('site-content') || document.body).appendChild(fabWrap);
                    btn.addEventListener('click', toggleTheme);
                    updateToggleButton(theme);
                }
            }

            // Set up toggle button after DOM loads
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', function () {
                    insertThemeToggle();
                });
            } else {
                insertThemeToggle();
            }

            // Listen for system theme changes (only if no user preference stored)
            if (window.matchMedia) {
                var mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
                var hasUserPreference = readCookie(THEME_COOKIE) !== null;
                if (mediaQuery.addEventListener) {
                    mediaQuery.addEventListener('change', function (e) {
                        if (!hasUserPreference) {
                            applyTheme(e.matches ? DARK : LIGHT);
                        }
                    });
                } else if (mediaQuery.addListener) {
                    // Safari < 14
                    mediaQuery.addListener(function (e) {
                        if (!hasUserPreference) {
                            applyTheme(e.matches ? DARK : LIGHT);
                        }
                    });
                }
            }
        })();
    </script>
</head>

<body>
    <!-- Password gate: personal access screen (client-side only) -->
    <div id="password-gate" class="password-gate" role="dialog" aria-modal="true" aria-labelledby="pw-title">
        <div class="password-gate__card">
            <div class="password-gate__hearts" aria-hidden="true">
                <span class="pw-heart pw-heart--1">&#10084;</span>
                <span class="pw-heart pw-heart--2">&#10084;</span>
                <span class="pw-heart pw-heart--3">&#10084;</span>
            </div>
            <h1 id="pw-title" class="password-gate__title">For You &#128151;</h1>
            <p class="password-gate__hint">Enter the special date to open our little world</p>
            <form id="password-form" class="password-gate__form" autocomplete="off">
                <label class="password-gate__label" for="password-input">Password</label>
                <input type="password" id="password-input" class="password-gate__input" placeholder="******"
                    maxlength="20" inputmode="numeric" aria-describedby="password-error" autofocus>
                <button type="submit" class="password-gate__btn">Unlock 💝</button>
                <p id="password-error" class="password-gate__error" role="alert" hidden>Not quite right, try again
                    &#128149;</p>
            </form>
        </div>
    </div>

    <div id="site-content" class="site-content" hidden>
        <nav id="love-nav" class="love-nav" aria-label="Sections">
            <a class="love-nav__link" href="#greetings" title="Greetings">
                <span class="love-nav__icon" aria-hidden="true">&#127800;</span>
                <span class="love-nav__label">Greetings</span>
            </a>
            <a class="love-nav__link" href="#story" title="Our Story">
                <span class="love-nav__icon" aria-hidden="true">&#128140;</span>
                <span class="love-nav__label">Our Story</span>
            </a>
            <a class="love-nav__link" href="#gallery" title="Our Gallery">
                <span class="love-nav__icon" aria-hidden="true">&#128158;</span>
                <span class="love-nav__label">Our Gallery</span>
            </a>

            <a class="love-nav__link" href="#jar">
                <span class="love-nav__icon" aria-hidden="true">&#128032;</span>
                <span class="love-nav__label">Love Jar</span>
            </a>

            <a class="love-nav__link" href="#music" title="Music">
                <span class="love-nav__icon" aria-hidden="true">&#127925;</span>
                <span class="love-nav__label">Music</span>
            </a>

            <a class="love-nav__link" href="#last" title="Love Letter">
                <span class="love-nav__icon" aria-hidden="true">&#128221;</span>
                <span class="love-nav__label">Love Letter</span>
            </a>
        </nav>

        <div id="emoji-rain" class="emoji-rain" aria-hidden="true"></div>

        <!-- Section 1: Greetings (built by js/greetings.js from data/content.json) -->
        <section id="greetings" class="section section--tree" aria-label="Greetings"></section>

        <!-- Section 2: Memory Timeline -->
        <section id="story" class="section section--memory" aria-label="Memory Timeline"></section>

        <!-- Section 3: Gallery -->
        <section id="gallery" class="section section--future" aria-label="Photo Booth Gallery"></section>

        <!-- Section 4: Love Jar -->
        <section id="jar" class="section section--jar" aria-label="Love Jar"></section>

        <!-- Section 5: Music -->
        <section id="music" class="section section--music" aria-label="Music"></section>

        <!-- Section 5: Letter (left) + Image-to-ASCII (right) -->
        <section id="last" class="section section--poem" aria-label="Love Letter and ASCII Artwork">
            <div class="poem-layout">
                <div class="poem-col poem-col--text">
                    <div id="poem-panel" class="poem-panel">
                    </div>
                </div>
                <div class="poem-col poem-col--art">
                    <div class="ascii-panel">
                        <div class="ascii-controls">
                            <label class="ascii-pixel-label">
                                Pixel size
                                <span class="ascii-slider-wrap">
                                    <input type="range" id="pixelSize" min="1" max="40" value="10">
                                    <span id="dangerBar" class="ascii-danger-bar"></span>
                                </span>
                            </label>
                            <span id="warning" class="ascii-warning"></span>
                            <div class="ascii-zoom-group">
                                <div id="zoomBtns" class="ascii-zoom-btns" hidden>
                                    <button type="button" id="zoomOut" class="ascii-zoom-btn" title="Zoom out"
                                        aria-label="Zoom out">&#8722;</button>
                                    <button type="button" id="zoomReset" class="ascii-zoom-btn" title="Reset zoom"
                                        aria-label="Reset zoom">1:1</button>
                                    <button type="button" id="zoomIn" class="ascii-zoom-btn" title="Zoom in"
                                        aria-label="Zoom in">+</button>
                                </div>
                                <button type="button" id="zoomToggle" class="ascii-toggle-btn" aria-expanded="false"
                                    aria-controls="zoomBtns">Zoom</button>
                            </div>
                        </div>
                        <div class="ascii-frame">
                            <div id="asciiViewport" class="ascii-viewport" tabindex="0"
                                aria-label="ASCII artwork. Scroll to zoom.">
                                <div id="asciiStage" class="ascii-stage">
                                    <div id="output" class="ascii-output"></div>
                                </div>
                            </div>
                        </div>
                        <canvas id="sourceCanvas" class="ascii-source-canvas"></canvas>
                    </div>
                </div>
            </div>
        </section>

    </div><!-- /#site-content -->
    <script type="text/javascript" src="js/emoji-rain.js" charset="utf-8"></script>
    <script type="text/javascript" src="js/sidebar.js"></script>
    <script type="text/javascript" src="js/content.js" charset="utf-8"></script>
    <script type="text/javascript" src="js/password-gate.js" charset="utf-8"></script>
</body>
